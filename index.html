<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golu's Little Maths Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b>🟠 golumaths</b>
  <button id="voice" type="button" aria-pressed="true">🔊 Voice on</button>
</header>

<main>
  <section id="play">
    <div id="garden" aria-label="Your flowers"></div>
    <h1 id="title">Add</h1>
    <p id="say"></p>
    <div id="picture" aria-hidden="true"></div>
    <p id="sum"></p>
    <div id="options" role="group" aria-label="Pick an answer"></div>
    <button id="hint" type="button">💡 Show me</button>
    <p id="hinttext" aria-live="polite"></p>
  </section>

  <section id="done" hidden>
    <div class="golu happy big"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div>
    <h2>Hooray, maths explorer!</h2>
    <p>You finished all 5 puzzles.</p>
    <p id="flowers"></p>
    <button id="again" class="big-btn" type="button">Play again 🌱</button>
  </section>

  <div id="feedback" hidden>
    <div class="golu big" id="golu"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i><i class="tear"></i></div>
    <p id="msg"></p>
  </div>
</main>

<footer>No timers. Five questions each time. Play with a grown-up.</footer>
<script src="script.js"></script>
</body>
</html>
